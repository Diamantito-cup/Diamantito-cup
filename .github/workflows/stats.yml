name: Generar Estadisticas Indestructibles

on:
  schedule:
    - cron: "0 0 * * *" # Se ejecuta todas las noches
  workflow_dispatch: # Permite darle al botón de actualizar a mano

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Genera la tarjeta de estadísticas generales
      - name: Tarjeta de Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: show_icons=true&theme=tokyonight&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Genera la tarjeta de tus lenguajes de programación
      - name: Tarjeta de Lenguajes
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: layout=compact&theme=tokyonight&langs_count=7
          path: profile/langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Guarda las imágenes generadas en tu propio repositorio automáticamente
      - name: Hacer Commit de las imágenes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@://github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
