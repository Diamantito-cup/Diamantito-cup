name: Metrics Avanzado
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Diamantito-cup
          template: classic
          base: header
          config_timezone: America/Bogota

          # 📊 1. PLUGIN: Lenguajes Estilizados
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes

          # 🍿 2. PLUGIN: AniList (Anime y Manga)
          plugin_anilist: yes
          plugin_anilist_output: svg # <-- MÁGICO: Crea un archivo independiente
          plugin_anilist_user: AngeXD
          plugin_anilist_sections: favorites, watching, reading
          plugin_anilist_limit: 4

          # 🎮 3. PLUGIN: Steam (Juegos)
          plugin_steam: yes
          plugin_steam_output: svg # <-- MÁGICO: Crea un archivo independiente
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_user: "76561199568234712"
          plugin_steam_sections: player, recent, favorites
          plugin_steam_games_limit: 4
