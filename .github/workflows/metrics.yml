name: Metrics
on:
  # Se ejecuta automáticamente todas las noches
  schedule: [{cron: "0 0 * * *"}]
  # Te permite activarlo manualmente con un botón cuando quieras
  workflow_dispatch:
  # Se ejecuta cada vez que haces un push en tu rama principal
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Nombre del archivo que va a generar en tu repositorio
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}

          # Configuración básica basada en tu primera imagen
          user: Diamantito-cup
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Bogota # Ajusta a tu zona horaria si quieres

          # 📊 PLUGIN: Lenguajes más usados
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-percentage, lines
          plugin_languages_sections: most-used

          # 🧮 PLUGIN: Hábitos de programación y actividad reciente
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # 🧱 PLUGIN: Tecnologías e iconos ordenados (los cuadritos de abajo)
          plugin_topics: yes
          plugin_topics_sort: stars
          plugin_topics_mode: icons
          plugin_topics_limit: 20
